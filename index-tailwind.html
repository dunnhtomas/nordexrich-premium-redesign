<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>NordexRich - Moderne Handelsplattform 2025</title>
    <meta name="description" content="NordexRich - Die führende Handelsplattform für automatisierte Investitionen mit 98.9% Erfolgsquote. Verdienen Sie zwischen €500 und €1,500 täglich.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        },
                        gold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706'
                        },
                        dark: {
                            800: '#1f2937',
                            900: '#111827'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['Space Grotesk', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'fade-in': 'fadeIn 1s ease-out'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- International Phone Input -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css">
    
    <!-- Custom Styles -->
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
            to { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .bg-gradient-radial {
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
        }
        .text-gradient {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .text-gold-gradient {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass {
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-sans antialiased">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass bg-gray-900/80 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <img src="images/logo2.png" alt="NordexRich" class="h-8 w-8 rounded-lg">
                    <span class="text-xl font-display font-bold text-gradient">NordexRich</span>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#hero" class="text-gray-300 hover:text-white transition-colors duration-200">Start</a>
                    <a href="#features" class="text-gray-300 hover:text-white transition-colors duration-200">Features</a>
                    <a href="#testimonials" class="text-gray-300 hover:text-white transition-colors duration-200">Erfolge</a>
                    <a href="#register" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-6 py-2 rounded-lg font-medium transition-all duration-200 transform hover:scale-105">
                        Registrieren
                    </a>
                </div>
                
                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button id="mobile-menu-btn" class="text-gray-300 hover:text-white focus:outline-none" title="Menü öffnen">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-gray-900/95 glass border-t border-gray-800">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="#hero" class="block px-3 py-2 text-gray-300 hover:text-white transition-colors duration-200">Start</a>
                <a href="#features" class="block px-3 py-2 text-gray-300 hover:text-white transition-colors duration-200">Features</a>
                <a href="#testimonials" class="block px-3 py-2 text-gray-300 hover:text-white transition-colors duration-200">Erfolge</a>
                <a href="#register" class="block px-3 py-2 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg font-medium text-center">Registrieren</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden">
        <!-- Background -->
        <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-blue-900/20 to-purple-900/20"></div>
        <div class="absolute inset-0 bg-gradient-radial"></div>
        
        <!-- Animated Background Elements -->
        <div class="absolute top-20 left-10 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl animate-float"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-float delay-[2s]"></div>
        
        <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid lg:grid-cols-2 gap-12 items-center">
                <!-- Hero Content -->
                <div class="text-center lg:text-left animate-slide-up">
                    <h1 class="text-4xl sm:text-5xl lg:text-7xl font-display font-bold leading-tight mb-6">
                        <span class="block text-white">VERDIENST</span>
                        <span class="block text-gold-gradient text-5xl sm:text-6xl lg:text-8xl font-black">€500 - €1.500</span>
                        <span class="block text-white">PRO TAG</span>
                    </h1>
                    
                    <p class="text-xl sm:text-2xl text-gray-300 mb-8 max-w-2xl">
                        Dank der revolutionären KI-gesteuerten Handelsplattform <span class="text-gradient font-semibold">NordexRich</span>
                    </p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start mb-8">
                        <a href="#register" class="bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-600 hover:to-gold-700 px-8 py-4 rounded-xl font-bold text-lg text-gray-900 transition-all duration-200 transform hover:scale-105 animate-glow">
                            Jetzt Starten
                        </a>
                        <a href="#features" class="border-2 border-blue-500 hover:bg-blue-500/10 px-8 py-4 rounded-xl font-bold text-lg transition-all duration-200">
                            Mehr Erfahren
                        </a>
                    </div>
                    
                    <div class="flex items-center justify-center lg:justify-start space-x-2 text-green-400">
                        <i class="fas fa-check-circle"></i>
                        <span class="text-lg font-medium">Anmeldung in Deutschland geöffnet</span>
                    </div>
                </div>
                
                <!-- Hero Visual -->
                <div class="relative animate-fade-in delay-[0.3s]">
                    <div class="relative max-w-lg mx-auto">
                        <!-- Phone Mockup -->
                        <div class="relative z-10 bg-gradient-to-br from-gray-800 to-gray-900 rounded-3xl p-2 shadow-2xl">
                            <img src="images/phone.webp" alt="Trading App" class="w-full rounded-2xl">
                        </div>
                        
                        <!-- Floating Stats -->
                        <div class="absolute -top-4 -left-4 bg-green-500 text-green-900 px-4 py-2 rounded-xl font-bold animate-float">
                            +€4,872
                        </div>
                        <div class="absolute -bottom-4 -right-4 bg-blue-500 text-blue-900 px-4 py-2 rounded-xl font-bold animate-float delay-[1s]">
                            98.9% Erfolg
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
            <a href="#features" class="text-gray-400 hover:text-white transition-colors duration-200" title="Nach unten scrollen">
                <i class="fas fa-chevron-down text-2xl"></i>
            </a>
        </div>
    </section>

    <!-- The rest of the HTML structure continues with all sections... -->
    
    <!-- Scripts -->
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });
        
        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                    // Close mobile menu if open
                    document.getElementById('mobile-menu').classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
