<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />

        <!-- Premium Dark Theme Stylesheets -->
        <link href="css/premium-dark-theme.css" rel="stylesheet" type="text/css" />
        <link href="css/premium-testimonials.css" rel="stylesheet" type="text/css" />
        <link href="css/premium-features.css" rel="stylesheet" type="text/css" />

    <body>
        <!-- Header -->
        <header class="header">
            <div class="container">

                    <div class="logo">
                        <img src="images/logo2.png" alt="NordexRich" />

                    </div>
                    
                    <nav class="nav">

        <main>

            <section id="hero" class="hero">

                            DANK DER HANDELSPLATTFORM NORDEXRICH
